# Build the atlas and publish it to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Test
        run: npm test
      - name: Build (validates the data first)
        run: npm run build
        env:
          # Absolute address of the site, used for the social preview image and canonical link.
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # A separate job, so the uploaded site is finalised before Pages looks for it
  # (deploying in the same job occasionally failed with "No artifacts named github-pages").
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
